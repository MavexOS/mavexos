[package]
name = "mavex-brush"
version = "0.5.0"
edition = "2024"

[[bin]]
name = "brush"
path = "src/main.rs"

[dependencies]
brush-core = "0.5.0"
brush-builtins = "0.2.0"
brush-parser = "0.4.0"
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync", "time"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage"] }
