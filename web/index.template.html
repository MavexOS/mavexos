<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MavexOS</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e14;color:#c8d3e0}
  #term{box-sizing:border-box;height:100%;padding:12px;margin:0;overflow:auto;
        font:14px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<pre id="term"></pre>
<script>
const KERNEL_WASM_B64 = "__KERNEL_WASM_BASE64__";
const term = document.getElementById("term");
const bytes = Uint8Array.from(atob(KERNEL_WASM_B64), c => c.charCodeAt(0));
let mem;
const imports = { host: {
  console_write(ptr, len) {
    term.textContent += new TextDecoder().decode(new Uint8Array(mem.buffer, ptr, len));
  }
}};
WebAssembly.instantiate(bytes, imports).then(({instance}) => {
  mem = instance.exports.memory;
  instance.exports.kmain();
  window.mavex = makeSyscalls(instance.exports);
  window.dispatchEvent(new Event("mavex-ready"));
});

function makeSyscalls(k) {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const put = (bytes) => { const p = k.k_alloc(bytes.length); new Uint8Array(mem.buffer, p, bytes.length).set(bytes); return [p, bytes.length]; };
  const withStr = (s, f) => { const [p, n] = put(enc.encode(s)); try { return f(p, n); } finally { k.k_free(p, n); } };
  const staged = (n) => dec.decode(new Uint8Array(mem.buffer, k.k_result_ptr(), n));
  return {
    mkdir: (path) => withStr(path, (p, n) => k.k_mkdir(p, n)),
    unlink: (path) => withStr(path, (p, n) => k.k_unlink(p, n)),
    writeFile: (path, text) => withStr(path, (p, n) => { const [d, dn] = put(enc.encode(text)); try { return k.k_write_file(p, n, d, dn); } finally { k.k_free(d, dn); } }),
    readFile: (path) => withStr(path, (p, n) => { const r = k.k_read_file(p, n); return r < 0 ? r : staged(r); }),
    readdir: (path) => withStr(path, (p, n) => { const r = k.k_readdir(p, n); return r < 0 ? r : (r === 0 ? [] : staged(r).split("\n")); }),
  };
}
</script>
</body>
</html>
